<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           ADMIN DASHBOARD
        ========================= */

        .resume-download-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .download-resume-button {
            display: inline-block;
            width: fit-content;
            padding: 9px 14px;
            border-radius: 9px;
            background: linear-gradient(135deg, #7b2ff7, #9b5cff);
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }

        .download-resume-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(123, 47, 247, 0.25);
        }

        .details-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .details-modal-card {
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            padding: 28px;
            position: relative;
            box-sizing: border-box;
        }

        .close-modal {
            position: absolute;
            right: 18px;
            top: 15px;
            border: none;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
        }

        .applicant-details {
            margin-top: 20px;
        }

        .detail-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-row strong {
            color: #6c2bd9;
        }

        .detail-row span {
            color: #333;
            word-break: break-word;
        }

        .action-buttons {
            white-space: nowrap;
        }

        .view-button,
        .delete-button {
            border: none;
            padding: 7px 11px;
            border-radius: 7px;
            cursor: pointer;
            margin: 2px;
            font-weight: 600;
        }

        .view-button {
            background: #eee;
            color: #5d20b8;
        }

        .delete-button {
            background: #ffe1e1;
            color: #d00000;
        }

        .view-button:hover,
        .delete-button:hover {
            transform: translateY(-1px);
        }

        @media (max-width: 700px) {

            .details-modal-card {
                padding: 20px;
            }

            .action-buttons {
                white-space: normal;
            }

        }

    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- LOGIN CHECK -->
    <!-- ========================= -->

    <script>

        async function checkAdminLogin() {

            try {

                const response =
                    await fetch("/api/admin/check");


                if (!response.ok) {

                    window.location.href =
                        "/login.html";

                    return;

                }


                const result =
                    await response.json();


                if (!result.loggedIn) {

                    window.location.href =
                        "/login.html";

                    return;

                }


                loadApplications();

            }

            catch (error) {

                console.error(error);

                window.location.href =
                    "/login.html";

            }

        }


        checkAdminLogin();

    </script>


    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="admin-header">

        <div>

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Internship Applications
            </p>

        </div>


        <button
            class="logout-button"
            onclick="logoutAdmin()">

            🚪 Logout

        </button>

    </header>


    <!-- ========================= -->
    <!-- DASHBOARD -->
    <!-- ========================= -->

    <section class="admin-container">


        <!-- ========================= -->
        <!-- STAT CARDS -->
        <!-- ========================= -->

        <div class="admin-stats">

            <div class="stat-card">

                <h2 id="totalApplications">
                    0
                </h2>

                <p>
                    Total Applications
                </p>

            </div>

        </div>


        <!-- ========================= -->
        <!-- APPLICATIONS CARD -->
        <!-- ========================= -->

        <div class="applications-card">


            <div class="applications-header">

                <h2>
                    All Applications
                </h2>


                <button
                    onclick="loadApplications()">

                    🔄 Refresh

                </button>

            </div>


            <!-- SEARCH -->

            <div class="admin-search">

                <input
                    type="text"
                    id="searchApplications"
                    placeholder="🔎 Search applications..."
                    oninput="filterApplications()">

            </div>


            <!-- TABLE -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>College</th>

                            <th>Course</th>

                            <th>Year</th>

                            <th>Skills</th>

                            <th>Internship</th>

                            <th>Company</th>

                            <th>Date</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="applicationsTable">

                    </tbody>

                </table>

            </div>


        </div>

    </section>


    <!-- ========================= -->
    <!-- VIEW DETAILS MODAL -->
    <!-- ========================= -->

    <div
        id="detailsModal"
        class="details-modal">


        <div class="details-modal-card">


            <button
                class="close-modal"
                onclick="closeDetails()">

                ✕

            </button>


            <h2>
                👤 Applicant Details
            </h2>


            <div
                id="applicantDetails"
                class="applicant-details">

            </div>


        </div>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>

        let allApplications = [];


        // =========================
        // LOAD APPLICATIONS
        // =========================

        async function loadApplications() {

            try {

                const response =
                    await fetch(
                        "/api/applications"
                    );


                if (response.status === 401) {

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        "Failed to load applications"
                    );

                }


                allApplications =
                    await response.json();


                document.getElementById(
                    "totalApplications"
                ).textContent =
                    allApplications.length;


                displayApplications(
                    allApplications
                );

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to load applications."
                );

            }

        }


        // =========================
        // DISPLAY APPLICATIONS
        // =========================

        function displayApplications(
            applications
        ) {

            const table =
                document.getElementById(
                    "applicationsTable"
                );


            table.innerHTML = "";


            if (
                applications.length === 0
            ) {

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="12"
                            class="no-data">

                            No applications found.

                        </td>

                    </tr>

                `;

                return;

            }


            applications.forEach(
                function(application) {


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            #${application.id}
                        </td>

                        <td>
                            ${escapeHTML(application.name)}
                        </td>

                        <td>
                            ${escapeHTML(application.email)}
                        </td>

                        <td>
                            ${escapeHTML(application.phone)}
                        </td>

                        <td>
                            ${escapeHTML(application.college)}
                        </td>

                        <td>
                            ${escapeHTML(application.course)}
                        </td>

                        <td>
                            ${escapeHTML(application.year)}
                        </td>

                        <td>
                            ${escapeHTML(application.skills)}
                        </td>

                        <td>
                            ${escapeHTML(application.internship || "-")}
                        </td>

                        <td>
                            ${escapeHTML(application.company || "-")}
                        </td>

                        <td>
                            ${escapeHTML(application.created_at)}
                        </td>

                        <td class="action-buttons">

                            <button
                                class="view-button"
                                onclick="viewDetails(${application.id})">

                                👁️ View

                            </button>

                            <button
                                class="delete-button"
                                onclick="deleteApplication(${application.id})">

                                🗑️ Delete

                            </button>

                        </td>

                    `;


                    table.appendChild(row);

                }
            );

        }


        // =========================
        // SEARCH
        // =========================

        function filterApplications() {

            const search =
                document.getElementById(
                    "searchApplications"
                ).value
                    .toLowerCase()
                    .trim();


            if (!search) {

                displayApplications(
                    allApplications
                );

                return;

            }


            const filtered =
                allApplications.filter(
                    function(application) {

                        const text = `

                            ${application.name}

                            ${application.email}

                            ${application.phone}

                            ${application.college}

                            ${application.course}

                            ${application.skills}

                            ${application.internship}

                            ${application.company}

                        `.toLowerCase();


                        return text.includes(
                            search
                        );

                    }
                );


            displayApplications(
                filtered
            );

        }


        // =========================
        // VIEW DETAILS
        // =========================

        function viewDetails(id) {

            const application =
                allApplications.find(
                    function(item) {

                        return item.id === id;

                    }
                );


            if (!application) {

                return;

            }


            const details =
                document.getElementById(
                    "applicantDetails"
                );


            details.innerHTML = `

                <div class="detail-row">

                    <strong>Application ID</strong>

                    <span>
                        #${application.id}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>Name</strong>

                    <span>
                        ${escapeHTML(application.name)}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>Email</strong>

                    <span>
                        ${escapeHTML(application.email)}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>Phone</strong>

                    <span>
                        ${escapeHTML(application.phone)}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>College</strong>

                    <span>
                        ${escapeHTML(application.college)}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>Course</strong>

                    <span>
                        ${escapeHTML(application.course)}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>Year</strong>

                    <span>
                        ${escapeHTML(application.year)}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>Skills</strong>

                    <span>
                        ${escapeHTML(application.skills)}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>Internship</strong>

                    <span>
                        ${escapeHTML(application.internship || "-")}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>Company</strong>

                    <span>
                        ${escapeHTML(application.company || "-")}
                    </span>

                </div>


                <div class="detail-row">

                    <strong>Why should we select you?</strong>

                    <span>
                        ${escapeHTML(application.message || "-")}
                    </span>

                </div>


                <!-- ========================= -->
                <!-- RESUME DOWNLOAD -->
                <!-- ========================= -->

                <div class="detail-row">

                    <strong>
                        Resume
                    </strong>

                    <div class="resume-download-area">

                        ${
                            application.resume
                            ? `

                                <span>
                                    ${escapeHTML(application.resume)}
                                </span>

                                <a
                                    href="/api/resume/${application.id}"
                                    class="download-resume-button"
                                    target="_blank">

                                    📥 Download Resume

                                </a>

                            `
                            : `

                                <span>
                                    Not uploaded
                                </span>

                            `
                        }

                    </div>

                </div>


                <div class="detail-row">

                    <strong>
                        Applied On
                    </strong>

                    <span>
                        ${escapeHTML(application.created_at)}
                    </span>

                </div>

            `;


            document.getElementById(
                "detailsModal"
            ).style.display = "flex";

        }


        // =========================
        // CLOSE DETAILS
        // =========================

        function closeDetails() {

            document.getElementById(
                "detailsModal"
            ).style.display = "none";

        }


        // =========================
        // CLOSE MODAL OUTSIDE
        // =========================

        document.getElementById(
            "detailsModal"
        ).addEventListener(
            "click",
            function(event) {

                if (
                    event.target === this
                ) {

                    closeDetails();

                }

            }
        );


        // =========================
        // DELETE APPLICATION
        // =========================

        async function deleteApplication(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this application?"
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/applications/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "/login.html";

                    return;

                }


                const result =
                    await response.json();


                if (result.success) {

                    alert(
                        "Application deleted successfully."
                    );


                    loadApplications();

                }

                else {

                    alert(
                        result.message ||
                        "Unable to delete application."
                    );

                }

            }


            catch (error) {

                console.error(error);

                alert(
                    "Unable to delete application."
                );

            }

        }


        // =========================
        // LOGOUT
        // =========================

        async function logoutAdmin() {

            try {

                const response =
                    await fetch(
                        "/api/admin/logout",
                        {
                            method: "POST"
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    window.location.href =
                        "/login.html";

                }

            }


            catch (error) {

                console.error(error);

            }

        }


        // =========================
        // HTML SECURITY
        // =========================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

    </script>


</body>

</html>
