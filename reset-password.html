<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Admin Password</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .reset-container {
            width: 100%;
            max-width: 430px;
        }

        .reset-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .reset-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .reset-card > p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        /* =========================
           PASSWORD INPUT
        ========================= */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        .password-wrapper input:focus {
            border-color: #7b2ff7;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            line-height: 1;
        }

        /* =========================
           NORMAL INPUT
        ========================= */

        .normal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        .normal-input:focus {
            border-color: #7b2ff7;
        }

        /* =========================
           RESET BUTTON
        ========================= */

        .reset-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                #7b2ff7,
                #9b5cff
            );
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }

        .reset-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 15px
                rgba(123, 47, 247, 0.25);
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: 600;
            min-height: 20px;
        }

        /* =========================
           BACK LOGIN
        ========================= */

        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7b2ff7;
            text-decoration: none;
            font-weight: 600;
        }

        .back-login:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="reset-container">

        <div class="reset-card">

            <h1>
                🔐 Reset Password
            </h1>

            <p>
                Enter your admin details and create a new password.
            </p>


            <form id="resetForm">


                <!-- =========================
                     USERNAME
                ========================= -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="normal-input"
                        placeholder="Enter your username"
                        required>

                </div>


                <!-- =========================
                     EMAIL
                ========================= -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="normal-input"
                        placeholder="Enter your admin email"
                        required>

                </div>


                <!-- =========================
                     NEW PASSWORD
                ========================= -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword(
                                'newPassword',
                                this
                            )">

                            👁️

                        </button>

                    </div>

                </div>


                <!-- =========================
                     CONFIRM PASSWORD
                ========================= -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword(
                                'confirmPassword',
                                this
                            )">

                            👁️

                        </button>

                    </div>

                </div>


                <!-- =========================
                     RESET BUTTON
                ========================= -->

                <button
                    type="submit"
                    class="reset-button">

                    🔐 Reset Password

                </button>


            </form>


            <!-- MESSAGE -->

            <div id="message"></div>


            <!-- BACK TO LOGIN -->

            <a
                href="login.html"
                class="back-login">

                ← Back to Login

            </a>

        </div>

    </div>


    <script>


        // =========================
        // SHOW / HIDE PASSWORD
        // =========================

        function togglePassword(
            inputId,
            button
        ) {

            const input =
                document.getElementById(
                    inputId
                );


            if (
                input.type === "password"
            ) {

                input.type = "text";

                button.textContent =
                    "🙈";

            }

            else {

                input.type = "password";

                button.textContent =
                    "👁️";

            }

        }


        // =========================
        // RESET PASSWORD
        // =========================

        document
            .getElementById("resetForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById(
                                "username"
                            )
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById(
                                "email"
                            )
                            .value
                            .trim();


                    const newPassword =
                        document
                            .getElementById(
                                "newPassword"
                            )
                            .value;


                    const confirmPassword =
                        document
                            .getElementById(
                                "confirmPassword"
                            )
                            .value;


                    const message =
                        document
                            .getElementById(
                                "message"
                            );


                    // =========================
                    // PASSWORD MATCH
                    // =========================

                    if (
                        newPassword !==
                        confirmPassword
                    ) {

                        message.textContent =
                            "❌ Passwords do not match.";

                        message.style.color =
                            "red";

                        return;

                    }


                    // =========================
                    // PASSWORD LENGTH
                    // =========================

                    if (
                        newPassword.length < 8
                    ) {

                        message.textContent =
                            "❌ Password must be at least 8 characters.";

                        message.style.color =
                            "red";

                        return;

                    }


                    try {

                        message.textContent =
                            "Please wait...";

                        message.style.color =
                            "#555";


                        const response =
                            await fetch(
                                "/api/admin/reset-password",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify({

                                            username:
                                                username,

                                            email:
                                                email,

                                            newPassword:
                                                newPassword

                                        })

                                }
                            );


                        const result =
                            await response.json();


                        // =========================
                        // SUCCESS
                        // =========================

                        if (
                            result.success
                        ) {

                            message.textContent =
                                "✅ Password reset successfully!";

                            message.style.color =
                                "green";


                            document
                                .getElementById(
                                    "resetForm"
                                )
                                .reset();


                            setTimeout(
                                function() {

                                    window.location.href =
                                        "login.html";

                                },
                                1500
                            );

                        }


                        // =========================
                        // ERROR
                        // =========================

                        else {

                            message.textContent =
                                "❌ " +
                                (
                                    result.message ||
                                    "Unable to reset password."
                                );

                            message.style.color =
                                "red";

                        }

                    }


                    catch (error) {

                        console.error(error);

                        message.textContent =
                            "❌ Unable to connect to server.";

                        message.style.color =
                            "red";

                    }

                }
            );

    </script>


</body>

</html>
